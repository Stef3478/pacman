<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pac-Man</title>
<meta name="description" content="Pac-Man in de browser: klassiek doolhof, vier spoken met eigen karakter, power-pillen en fruit.">
<meta name="theme-color" content="#05060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pac-Man">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23ffe600'/><path d='M16 16 L32 6 L32 26 Z' fill='%23000'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="hud">
      <div class="hud-item"><span class="label">Score</span><span id="score" class="value">000000</span></div>
      <div class="hud-item"><span class="label">Record</span><span id="highscore" class="value">000000</span></div>
      <div class="hud-item"><span class="label">Level</span><span id="level" class="value">1</span></div>
      <div class="hud-item lives-item"><span class="label">Levens</span><span id="lives" class="lives"></span></div>
    </header>

    <div class="stage">
      <canvas id="game" width="448" height="496" aria-label="Pac-Man speelveld"></canvas>
      <div id="overlay" class="overlay" hidden>
        <h1 id="overlay-title">PAC-MAN</h1>
        <p id="overlay-text"></p>
        <button id="overlay-button" class="btn" type="button">Start</button>
      </div>
    </div>

    <div id="trackpad" class="trackpad" aria-label="Veegveld: veeg omhoog, omlaag, naar links of naar rechts om Pac-Man te sturen">
      <div class="arrow up" data-arrow="up">&#9650;</div>
      <div class="arrow left" data-arrow="left">&#9664;</div>
      <div class="arrow right" data-arrow="right">&#9654;</div>
      <div class="arrow down" data-arrow="down">&#9660;</div>
      <p class="trackpad-label">Veeg hier om te sturen</p>
      <span id="trackpad-dot" class="trackpad-dot" hidden></span>
    </div>

    <footer class="controls">
      <button id="pause" class="btn small" type="button">Pauze</button>
      <button id="mute" class="btn small" type="button" aria-pressed="false">Geluid aan</button>
      <p class="hint">Pijltjes of WASD &middot; P pauzeert &middot; M zet het geluid uit</p>
    </footer>
  </main>

  <script src="js/maze.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
